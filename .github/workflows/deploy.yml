# Dois builds do mesmo commit, porque os destinos têm raízes diferentes:
#
#   1. GitHub Pages (preview, no ar em /unilever-website/) — build com
#      DEPLOY_TARGET=pages, publicado automaticamente.
#   2. Hostinger (produção, raiz do domínio) — build padrão, base '/', subido
#      como artifact "dist-hostinger". Baixe em Actions > o run > Artifacts e
#      jogue o conteúdo no public_html.
#
# A ordem importa: o deploy do Pages consome dist/ antes do segundo build
# sobrescrever a pasta.
name: Deploy Pages + build Hostinger

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (GitHub Pages, base /unilever-website/)
        run: npm run build
        env:
          DEPLOY_TARGET: pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the built site
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # A partir daqui é o build da Hostinger. Refaz dist/ do zero para não
      # sobrar nada com o base do Pages dentro.
      - name: Build (Hostinger, base /)
        run: rm -rf dist && npm run build

      - name: Upload dist para a Hostinger
        uses: actions/upload-artifact@v4
        with:
          name: dist-hostinger
          path: dist/
          retention-days: 30
